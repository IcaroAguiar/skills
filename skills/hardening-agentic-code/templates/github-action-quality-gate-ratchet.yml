name: Agentic Quality Gate
run-name: Agentic Quality Gate - ${{ github.ref_name }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: Refresh baseline after a passing main/default-branch run
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agentic-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - name: Agentic review packet
        env:
          AGENTIC_REVIEW_BASE: origin/${{ github.base_ref || 'main' }}
        run: node docs/ai/quality-gate/vendor/collect-review-context.mjs --base "$AGENTIC_REVIEW_BASE" --json > docs/ai/quality-gate/agentic-review-packet.json
      - name: Ratchet quality gate
        env:
          AGENTIC_REVIEW_BASE: origin/${{ github.base_ref || 'main' }}
        run: node docs/ai/quality-gate/check-ratchet.mjs
      - name: Refresh baseline artifact
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_baseline == true && github.ref == 'refs/heads/main'
        run: node docs/ai/quality-gate/refresh-baseline.mjs
      - name: Comment PR quality gate
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENTIC_QUALITY_GATE_REQUIRE_PR_COMMENT: "false"
        run: node docs/ai/quality-gate/post-pr-comment.mjs
      - name: Upload quality artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentic-quality-gate
          retention-days: 14
          path: |
            docs/ai/quality-gate/*report*.json
            docs/ai/quality-gate/*report*.md
            docs/ai/quality-gate/quality-trend-entry.json
            docs/ai/quality-gate/auto-improvement-queue.json
            docs/ai/quality-gate/agentic-review-packet.json
