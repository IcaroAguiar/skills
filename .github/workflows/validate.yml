name: Validate catalogue

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-skills.mjs
      - run: node scripts/test-design-art-direction-contracts.mjs
      - name: Validate Review Loop package
        run: node skills/review-loop/scripts/validate-skill-package.mjs skills/review-loop
      - name: Test Review Loop engine routing
        run: |
          node skills/review-loop/scripts/test-engine-selection.mjs
          node skills/review-loop/scripts/test-harness-adapters.mjs
      - name: Test Review Loop state and corpus guards
        run: |
          node skills/review-loop/scripts/test-review-state-fingerprint.mjs
          node skills/review-loop/scripts/test-real-diff-corpus.mjs
          node skills/review-loop/scripts/test-quality-gate-ratchet.mjs
          node skills/review-loop/scripts/validate-real-diff-corpus.mjs skills/review-loop/templates/real-diff-corpus.example.json
      - name: Test Review Loop deterministic collector
        run: node skills/review-loop/scripts/test-smoke-cleanup.mjs
