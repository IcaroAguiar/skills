name: Validate catalogue

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-skills.mjs
      - run: node scripts/test-design-art-direction-contracts.mjs
      - name: Validate code review consumers
        run: |
          node skills/gating-testability/scripts/validate-skill-package.mjs
          node --test skills/gating-testability/tests/smoke-pressure-scenarios.test.mjs
          node skills/orchestrate-split/scripts/test-schema-contract.mjs
          node skills/orchestrate-split/scripts/fixture-smoke.mjs
